# Ruff is the single backend linter and formatter (ADR-094). Configuration
# mirrors docs/developer/coding-standards.md §1.1 / §1.4: 88-column lines,
# double quotes (format), and the five-group import order. pytest reads
# pytest.ini; this file carries Ruff's config only.

[tool.ruff]
line-length = 88
target-version = "py312"
# Applied migrations are frozen history -- generated by Alembic and never
# reformatted or re-sorted. Editing an applied revision forks the chain
# (ADR-065); lint and format skip the directory entirely.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# The enforceable core of §1.1: pycodestyle errors, pyflakes, isort.
# E501 is deliberately not selected: `ruff format` owns the 88-column target
# for code, and E501's residue is long strings/comments/docstrings the
# formatter cannot wrap (e.g. the HTML email templates in shared/otp_email.py).
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Slice constants modules re-export shared bounds for their own consumers
# (coding-standards.md §1.9); those imports are load-bearing, not dead.
"**/constants.py" = ["F401"]

[tool.ruff.lint.isort]
# The five-group order from §1.4: stdlib, third-party, core, shared, features.
# `api`, `tests`, and `main` are first-party too, so they travel in the final
# local section rather than adding a sixth and seventh section.
section-order = [
    "future",
    "standard-library",
    "third-party",
    "core",
    "shared",
    "features",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"core" = ["core"]
"shared" = ["shared"]
# Every other first-party package travels in the final local section. `main`
# belongs here too: it imports `core`, `shared`, and `features`, so it is not
# a feature slice itself, but it must not sort with third-party packages.
"features" = ["features", "api", "tests", "main"]
