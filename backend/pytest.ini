[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = src/tests
markers =
    slow: slow test (deselect with '-m "not slow"')
    integration: needs a live/external service such as Postgres (set TEST_DATABASE_URL)
filterwarnings =
    # `starlette.exceptions.StarletteDeprecationWarning` subclasses UserWarning,
    # not DeprecationWarning. Emitted once per test that imports TestClient
    # because this starlette release prefers httpx2 over httpx; nothing this
    # suite can act on.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
