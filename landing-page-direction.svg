<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#17365d" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1536" height="864" fill="#f8fafc"/>
  <rect width="1536" height="64" fill="#203f68"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(44 18)">
      <rect width="27" height="27" rx="5" fill="#315c9a"/>
      <path d="M7 9h5v5H7zm9 0h5v5h-5zM7 17h5v5H7zm9 0h5v5h-5z" fill="#fff"/>
      <circle cx="23" cy="23" r="6" fill="#38a169" stroke="#fff" stroke-width="2"/>
      <text x="38" y="21" fill="#fff" font-size="20" font-weight="700">Attendly</text>
    </g>
    <text x="1214" y="39" fill="#dbe6f6" font-size="15">How it works</text>
    <text x="1352" y="39" fill="#dbe6f6" font-size="15">Privacy</text>
    <text x="1442" y="39" fill="#dbe6f6" font-size="15">Support</text>

    <text x="168" y="164" fill="#56708f" font-size="15" font-weight="700" letter-spacing="1.2">ATTENDANCE, WITHOUT THE QUEUE</text>
    <text x="168" y="218" fill="#183b65" font-size="42" font-weight="700">A clearer start to every class.</text>
    <text x="168" y="255" fill="#536b87" font-size="19">Scan a session QR, confirm presence, and keep a reliable record—</text>
    <text x="168" y="282" fill="#536b87" font-size="19">even when your connection is unreliable.</text>
    <g transform="translate(168 326)">
      <circle cx="11" cy="11" r="11" fill="#dcebe2"/><path d="M6 11l3 3 6-7" fill="none" stroke="#247448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="16" fill="#334e6d" font-size="16">Session QR codes refresh automatically</text>
      <circle cx="11" cy="49" r="11" fill="#dcebe2"/><path d="M6 49l3 3 6-7" fill="none" stroke="#247448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="54" fill="#334e6d" font-size="16">Works offline and syncs when you reconnect</text>
      <circle cx="11" cy="87" r="11" fill="#dcebe2"/><path d="M6 87l3 3 6-7" fill="none" stroke="#247448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="92" fill="#334e6d" font-size="16">Built-in liveness checks protect attendance records</text>
    </g>
    <g transform="translate(168 475)">
      <text y="0" fill="#56708f" font-size="13" font-weight="700" letter-spacing="1">HOW IT WORKS</text>
      <line x1="0" y1="27" x2="388" y2="27" stroke="#d8e0ea"/>
      <text y="59" fill="#193d67" font-size="23" font-weight="700">1</text><text x="34" y="59" fill="#334e6d" font-size="16">Professor opens a class session</text>
      <text y="96" fill="#193d67" font-size="23" font-weight="700">2</text><text x="34" y="96" fill="#334e6d" font-size="16">Students scan the displayed QR code</text>
      <text y="133" fill="#193d67" font-size="23" font-weight="700">3</text><text x="34" y="133" fill="#334e6d" font-size="16">Attendance is confirmed and recorded</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="890" y="136" width="448" height="548" rx="10" fill="#fff" stroke="#dbe3ec"/>
    </g>
    <text x="938" y="196" fill="#193d67" font-size="27" font-weight="700">Welcome back</text>
    <text x="938" y="224" fill="#60758f" font-size="15">Sign in to continue to your portal.</text>
    <text x="938" y="274" fill="#3d5875" font-size="14" font-weight="700">School email</text>
    <rect x="938" y="287" width="352" height="46" rx="5" fill="#fff" stroke="#bdcad8"/>
    <text x="953" y="316" fill="#9aacbd" font-size="15">name@school.edu</text>
    <text x="938" y="371" fill="#3d5875" font-size="14" font-weight="700">Password</text>
    <text x="1206" y="371" fill="#2461b6" font-size="13" font-weight="700">Forgot password?</text>
    <rect x="938" y="384" width="352" height="46" rx="5" fill="#fff" stroke="#bdcad8"/>
    <text x="953" y="414" fill="#60758f" font-size="19">••••••••</text>
    <rect x="938" y="458" width="352" height="48" rx="5" fill="#204778"/>
    <text x="1114" y="488" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Sign in</text>
    <text x="1114" y="545" text-anchor="middle" fill="#60758f" font-size="14">New to Attendly? <tspan fill="#2461b6" font-weight="700">Create an account</tspan></text>
    <line x1="938" y1="579" x2="1290" y2="579" stroke="#e0e6ee"/>
    <g transform="translate(938 608)">
      <path d="M10 0l9 4v8c0 6-4 10-9 12C5 22 1 18 1 12V4z" fill="#e5effb" stroke="#2b609a"/>
      <path d="M6 12l3 3 5-6" fill="none" stroke="#247448" stroke-width="2"/>
      <text x="34" y="10" fill="#3e5875" font-size="13" font-weight="700">Your attendance data is protected</text>
      <text x="34" y="29" fill="#6b8099" font-size="12">Only authorized staff can access your records.</text>
    </g>
  </g>
</svg>
