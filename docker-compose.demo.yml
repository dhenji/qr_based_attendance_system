# Demo-only compose file.
#
# Usage:
#   cp backend/.env.demo.example backend/.env.demo   # then fill in real values
#   docker compose -f docker-compose.demo.yml --profile tunnel up --build
#
# This keeps the same images as docker-compose.dev.yml but uses demo-safe
# defaults: DEBUG=false, scheduler/crons off, benchmark mode off, and the
# Cloudflare tunnel profile enabled on demand. Secrets are read from
# backend/.env.demo (gitignored) via env_file, never hardcoded here.

services:
  db:
    image: postgres:16-alpine
    container_name: attendance-demo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance_sys
    ports:
      - "5432:5432"
    volumes:
      - demopgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_sys"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: migrate
    env_file:
      - ./backend/.env.demo
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/attendance_sys
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128"
    volumes:
      - ./backend:/app
      - ./frontend/static/models/face_landmarker.task:/app/face_landmarker.task:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: runtime
    container_name: attendance-demo-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.demo
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/attendance_sys
      DEBUG: "false"
      SCHEDULER_ENABLED: "false"
      BENCHMARK_MODE: "false"
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128"
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - ./backend:/app
      - ./frontend/static/models/face_landmarker.task:/app/face_landmarker.task:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: attendance-demo-app
    ports:
      - "5173:5173"
    environment:
      PUBLIC_API_URL: ""
      VITE_API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --url http://app:5173
    depends_on:
      - app

volumes:
  demopgdata: