# Continuous integration for the backend suite, the Alembic migration chain, and
# the frontend typecheck. See ADR-069 for why these three gates and nothing more.
#
# One workflow, three parallel jobs -- not three workflows with `paths:` filters.
# A path filter makes a job report as "skipped" when an unrelated file changes,
# which parks a required status check in `pending` and blocks the PR anyway.
#
# The three job `name:` values below are load-bearing once branch protection is
# configured: renaming a job silently un-enforces its required status check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, reads a secret, or needs a token.
permissions:
  contents: read

# A new push to a PR supersedes the run in flight; its results are obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend suite (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # `Settings.env_file = ".env"` is resolved relative to the CWD and
        # `alembic.ini` uses `script_location = alembic`, so both tools only
        # work from backend/. Imports are `features.*` / `core.*`, never
        # `src.features.*`, hence PYTHONPATH=src below.
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches backend/Dockerfile.dev (`python:3.12-slim`) and the
          # "Python 3.12+" floor in the README.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the suite
        env:
          PYTHONPATH: src
        # DEBUG and JWT_SECRET are deliberately absent: conftest.py *assigns*
        # them before importing core.config, so anything set here would be
        # overridden dead config. TEST_DATABASE_URL is unset on purpose, which
        # selects the in-memory SQLite database (conftest.py:191) -- this leg
        # needs no services and no secrets.
        run: python -m pytest src/tests -q

  migrations:
    name: Migration drift (alembic check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_ci
        ports:
          - 5432:5432
        # The health gate is not optional. Without it `alembic upgrade head`
        # races container initialisation and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres -d attendance_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/attendance_ci
      # `alembic/env.py:28` builds Settings() to read DATABASE_URL, and
      # `require_jwt_secret_in_prod` raises when DEBUG is false and JWT_SECRET is
      # empty. DEBUG is the switch; no JWT secret is needed for a throwaway CI
      # database.
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply the migration chain
        run: alembic upgrade head

      - name: Assert no drift between models and migrations
        # conftest.py builds the test schema with `Base.metadata.create_all`,
        # straight from the models, so the 719 cases exercise the migration
        # chain in neither direction and cannot detect drift (ADR-065). This is
        # the only gate that can. It raises AutogenerateDiffsDetected -- non-zero
        # exit -- when a model and the chain disagree.
        run: alembic check

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches frontend/Dockerfile.dev (`node:22-alpine`). Pinned here
          # rather than in an `engines` field because package.json has none, so
          # .npmrc's `engine-strict=true` enforces nothing today.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci`, never `npm install`: every range in package.json is a caret,
        # so `install` would drift the lockfile. This also fires `prepare` ->
        # `svelte-kit sync`, generating the .svelte-kit/tsconfig.json that the
        # repo's tsconfig.json extends -- without it `npm run check` cannot
        # resolve on a fresh checkout.
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build
        run: npm run build