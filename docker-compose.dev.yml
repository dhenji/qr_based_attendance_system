services:
  db:
    image: postgres:16-alpine
    container_name: attendance-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance_sys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_sys"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/attendance_sys
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: runtime
    container_name: attendance-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/attendance_sys
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: runtime
    profiles:
      - test
    working_dir: /app
    environment:
      DEBUG: "true"
      PYTHONPATH: /app/src
    volumes:
      - ./backend/src:/app/src
    command:
      - python
      - -m
      - pytest
      - -p
      - no:cacheprovider
      - src/tests
      - -v

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: attendance-app
    ports:
      - "5173:5173"
    environment:
      PUBLIC_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api


volumes:
  pgdata:
